name: Build .NET MAUI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.0'
  CONFIGURATION: 'Release'

jobs:
  build-android:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Android
      run: dotnet build -c ${{ env.CONFIGURATION }} -f net8.0-android

    - name: Publish Android APK
      run: |
        dotnet publish -c ${{ env.CONFIGURATION }} -f net8.0-android \
          -p:AndroidPackageFormat=apk \
          -p:AndroidSigningKeyPass= \
          -p:AndroidSigningStorePass= \
          -p:AndroidKeyStore=false
      
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: **/*-Signed.apk

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install Windows SDK
      uses: microsoft/setup-msbuild@v1.3

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Windows
      run: dotnet build -c ${{ env.CONFIGURATION }} -f net8.0-windows10.0.19041.0

    - name: Publish Windows
      run: |
        dotnet publish -c ${{ env.CONFIGURATION }} -f net8.0-windows10.0.19041.0 \
          -p:WindowsPackageType=None
      
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: bin/${{ env.CONFIGURATION }}/**/*.exe
