<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NVPN.Cross</title>
    <base href="/" />
    <link rel="stylesheet" href="NVPN.Cross.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css?v=@(MudBlazor.Metadata.Version)" rel="stylesheet" />
    <style>
        /* Стили для загрузки - отдельный контейнер, не влияет на #app */
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #282830;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #app-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <!-- Отдельный контейнер для загрузки, не влияет на приложение -->
    <div id="app-loader">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text">Загрузка<span class="loading-dots"></span></div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=@(MudBlazor.Metadata.Version)"></script>
    <script>
        // Скрываем загрузку после того, как Blazor загрузится
        window.addEventListener('load', function() {
            // Ждем немного, чтобы убедиться, что Blazor начал рендеринг
            setTimeout(function() {
                var loader = document.getElementById('app-loader');
                if (loader) {
                    loader.classList.add('hidden');
                    // Удаляем элемент после анимации, чтобы он не мешал
                    setTimeout(function() {
                        if (loader.parentNode) {
                            loader.parentNode.removeChild(loader);
                        }
                    }, 500);
                }
            }, 300);
        });

        // Также скрываем загрузку при событии Blazor
        if (window.Blazor) {
            window.Blazor.start().then(function() {
                setTimeout(function() {
                    var loader = document.getElementById('app-loader');
                    if (loader) {
                        loader.classList.add('hidden');
                        setTimeout(function() {
                            if (loader.parentNode) {
                                loader.parentNode.removeChild(loader);
                            }
                        }, 500);
                    }
                }, 300);
            });
        }
    </script>

</body>

</html>
